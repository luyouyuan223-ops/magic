name: Deploy website to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'style.css'
      - 'app.js'
      - 'assets/**'
      - '.nojekyll'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v6
      - name: Prepare website assets
        run: |
          mkdir -p public
          cp index.html style.css app.js .nojekyll public/
          cp -R assets public/assets
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '56d775cf9bb8168619a80cd9467ba9e2'
          wranglerVersion: '4.156.0'
          command: pages deploy public --project-name=luyouyuan-magic --branch=main
